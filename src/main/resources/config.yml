# Kingdom plugin configuration

join-reminder: true

join-message:
  - "&6Welcome! Choose your realm with &e/kingdom list&6, then &e/kingdom join <name>&6."

# Kingdoms are created in-game with /kingdom create or listed here:
kingdoms: {}

economy:
  starting-treasury: 100.0
  mint-placement-cost: 50.0
  max-mints-per-kingdom: 3
  villager-gdp:
    tick-interval-ticks: 24000
  # Trades worked in the open, whose daily yield swings with the season's outdoor yield factor.
  # Every trade left off this list is indoor and holds its yield the year round.
  outdoor-professions:
    - farmer
    - fisherman
    - shepherd
  frozen-wallet-escheat-mc-days: 30
  frozen-wallet-strike-mc-days: 7
  villager-commerce-tax-rate: 0.05
  villager-trades:
    settlements-per-edge: 3
    edges:
      - buyer: farmer
        seller: butcher
        spend-percent: 0.15
      - buyer: fisherman
        seller: farmer
        spend-percent: 0.10
      - buyer: librarian
        seller: cartographer
        spend-percent: 0.20
      - buyer: armorer
        seller: weaponsmith
        spend-percent: 0.12
      - buyer: shepherd
        seller: leatherworker
        spend-percent: 0.10
      - buyer: none
        seller: farmer
        flat-corona: 0.20
  # Each villager stocks at most max-offers of its profession's Corona offers, reshuffled
  # every period-hours. max-offers: 0 stocks the lot.
  corona-merchant-rotation:
    max-offers: 6
    period-hours: 24
  # Corona-priced villager offers, by profession. Optional keys: amount (default 1),
  # max-uses (default 12), enchantment + enchantment-level (enchanted_book stores it,
  # any other item wears it). Defining this section replaces the built-in offer list.
  corona-merchant-offers:
    farmer:
      - item: bread
        amount: 4
        corona-price: 3
        max-uses: 12
      - item: golden_carrot
        amount: 2
        corona-price: 8
        max-uses: 8
      - item: cake
        corona-price: 12
        max-uses: 4
    librarian:
      - item: book
        amount: 4
        corona-price: 5
        max-uses: 12
      - item: bookshelf
        amount: 2
        corona-price: 12
        max-uses: 8
      - item: name_tag
        corona-price: 24
        max-uses: 4
      - item: enchanted_book
        enchantment: mending
        enchantment-level: 1
        corona-price: 96
        max-uses: 1
      - item: enchanted_book
        enchantment: unbreaking
        enchantment-level: 3
        corona-price: 72
        max-uses: 2
      - item: enchanted_book
        enchantment: efficiency
        enchantment-level: 4
        corona-price: 64
        max-uses: 2
      - item: enchanted_book
        enchantment: fortune
        enchantment-level: 3
        corona-price: 88
        max-uses: 1
      - item: enchanted_book
        enchantment: silk_touch
        enchantment-level: 1
        corona-price: 80
        max-uses: 1
      - item: enchanted_book
        enchantment: protection
        enchantment-level: 4
        corona-price: 64
        max-uses: 2
      - item: enchanted_book
        enchantment: sharpness
        enchantment-level: 4
        corona-price: 60
        max-uses: 2
      - item: enchanted_book
        enchantment: looting
        enchantment-level: 3
        corona-price: 72
        max-uses: 1
      - item: enchanted_book
        enchantment: feather_falling
        enchantment-level: 4
        corona-price: 48
        max-uses: 2
      - item: enchanted_book
        enchantment: infinity
        enchantment-level: 1
        corona-price: 80
        max-uses: 1
    cleric:
      - item: experience_bottle
        amount: 4
        corona-price: 16
        max-uses: 8
      - item: ender_pearl
        corona-price: 20
        max-uses: 6
      - item: glowstone
        amount: 4
        corona-price: 14
        max-uses: 8
    toolsmith:
      - item: iron_pickaxe
        corona-price: 24
        max-uses: 6
      - item: diamond_pickaxe
        corona-price: 96
        max-uses: 2
    weaponsmith:
      - item: iron_sword
        corona-price: 20
        max-uses: 6
      - item: diamond_sword
        corona-price: 96
        max-uses: 2
    armorer:
      - item: iron_chestplate
        corona-price: 32
        max-uses: 4
      - item: shield
        corona-price: 18
        max-uses: 6
    cartographer:
      - item: map
        amount: 2
        corona-price: 6
        max-uses: 8
      - item: compass
        corona-price: 18
        max-uses: 4
    fletcher:
      - item: arrow
        amount: 16
        corona-price: 6
        max-uses: 12
      - item: bow
        corona-price: 22
        max-uses: 4
    butcher:
      - item: cooked_beef
        amount: 6
        corona-price: 6
        max-uses: 12
    shepherd:
      - item: white_wool
        amount: 8
