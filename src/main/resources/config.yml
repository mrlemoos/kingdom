# Kingdom plugin configuration

join-reminder: true

join-message:
  - "&6Welcome! Choose your realm with &e/kingdom list&6, then &e/kingdom join <name>&6."

# Kingdoms are created in-game with /kingdom create or listed here:
kingdoms: {}

economy:
  starting-treasury: 100.0
  mint-placement-cost: 50.0
  max-mints-per-kingdom: 3
  villager-gdp:
    tick-interval-ticks: 24000
  frozen-wallet-escheat-mc-days: 30
  villager-commerce-tax-rate: 0.05
  villager-trades:
    settlements-per-edge: 3
    edges:
      - buyer: farmer
        seller: butcher
        spend-percent: 0.15
      - buyer: fisherman
        seller: farmer
        spend-percent: 0.10
      - buyer: librarian
        seller: cartographer
        spend-percent: 0.20
      - buyer: armorer
        seller: weaponsmith
        spend-percent: 0.12
      - buyer: shepherd
        seller: leatherworker
        spend-percent: 0.10
      - buyer: none
        seller: farmer
        flat-corona: 0.20
  corona-merchant-offers:
    farmer:
      - item: bread
        corona-price: 3
        max-uses: 12
    librarian:
      - item: book
        corona-price: 5
        max-uses: 12
  realm-wealth:
    materials:
      gold-block: 100
      diamond-block: 500
      emerald-block: 250
      iron-block: 50
      copper-block: 25
    estates:
      lodestone: 50
      conduit: 250
      beacon: 500
  activity:
    harvest-cooldown-ms: 3000
    craft-cooldown-ms: 1000
    villager-trade-cooldown-ms: 5000
    player-trade-cooldown-ms: 10000
    harvest-diminishing-threshold-per-hour: 100
    harvest-diminishing-multiplier: 0.5
    villager-trade-emerald-rate: 0.10
    emerald-commerce-corona-rate: 1.0
    player-trade-bonus: 0.05
  life-events:
    daily-cap: 2.0
    sleep-reward: 0.8
    eat-reward: 0.2
    max-eats-per-day: 3
    build-reward-per-block: 0.01
    build-daily-cap: 0.5
    social-reward: 0.1
    social-interval-ms: 300000
    social-proximity-blocks: 16
    own-kingdom-multiplier: 1.5

loyalty:
  political:
    enabled: true
  recovery:
    mc-days-per-tier: 3
  military:
    enabled: true
    recovery:
      mc-days-per-tier: 1

police:
  mechanical-act-breach:
    enabled: true

enforcement:
  build:
    enabled: true
    debounce-ms: 500
  pvp:
    enabled: false
  curfew:
    enabled: false
    window-start-tick: 13000
    window-end-tick: 23000

war:
  enabled: false
  muster:
    enabled: true
  roster:
    cap: 8
  oath:
    enabled: true
  crown-squads:
    enabled: false
    cost: 50.0
    cap: 4
  conscription:
    enabled: true
    cap: 16
  siege-release:
    enabled: true
    duration-mc-days: 1
    hardened-threshold-mc-days: 1
  siege:
    enabled: true
    flip-threshold-ticks: 3
  aims:
    territory-threshold-ratio: 0.5
  squads:
    enabled: false
    max-members-per-squad: 6
    max-squads-per-officer: 1
    max-squads-per-kingdom: 8

election:
  general-interval-mc-days: 120
  duration-mc-days: 3
  inaugural-fiscal-delay-mc-days: 2
  max-player-seats: 4
  total-seats: 8
  ms-per-mc-day: 1200000
  profession-vote-bias:
    FISCAL:
      farmer: nay
      librarian: aye
      armorer: nay
      weaponsmith: nay
      toolsmith: aye
    BUDGET:
      farmer: aye
      librarian: aye
      armorer: nay
      cleric: aye
    SPEND_MINT:
      farmer: aye
      librarian: aye
      armorer: nay
      cartographer: aye
    SPEND_STIPEND:
      farmer: aye
      librarian: nay
      armorer: nay
      shepherd: aye
