      - item: stone_bricks
        amount: 16
        corona-price: 8
        max-uses: 12
    fisherman:
      - item: cooked_salmon
        amount: 6
        corona-price: 6
        max-uses: 12
    leatherworker:
      - item: leather
        amount: 6
        corona-price: 8
        max-uses: 12
  realm-wealth:
    materials:
      gold-block: 100
      diamond-block: 500
      emerald-block: 250
      iron-block: 50
      copper-block: 25
    estates:
      lodestone: 50
      conduit: 250
      beacon: 500
  activity:
    harvest-cooldown-ms: 3000
    craft-cooldown-ms: 1000
    villager-trade-cooldown-ms: 5000
    player-trade-cooldown-ms: 10000
    harvest-diminishing-threshold-per-hour: 100
    harvest-diminishing-multiplier: 0.5
    villager-trade-emerald-rate: 0.10
    emerald-commerce-corona-rate: 1.0
    player-trade-bonus: 0.05
  life-events:
    daily-cap: 2.0
    sleep-reward: 0.8
    eat-reward: 0.2
    max-eats-per-day: 3
    build-reward-per-block: 0.01
    build-daily-cap: 0.5
    social-reward: 0.1
    social-interval-ms: 300000
    social-proximity-blocks: 16
    own-kingdom-multiplier: 1.5

loyalty:
  political:
    enabled: true
  # Days knocked off a running recovery clock per act of service (both tracks).
  service-credit:
    days: 1
  recovery:
    mc-days-per-tier: 3
  military:
    enabled: true
    recovery:
      mc-days-per-tier: 1

police:
  mechanical-act-breach:
    enabled: true
  crown-assault:
    # Patrol golem must be this close to the victim to witness assault on the Crown.
    witness-range-blocks: 32
  trial:
    # Real-time seconds for the trial window (jury ballots or villager spectacle) before lapse.
    window-seconds: 120
  trial-jury:
    # Legacy key — prefer police.trial.window-seconds.
    window-seconds: 120

enforcement:
  build:
    enabled: true
    debounce-ms: 500
  pvp:
    enabled: false
  curfew:
    enabled: false
    window-start-tick: 13000
    window-end-tick: 23000

war:
  enabled: false
  muster:
    enabled: true
  roster:
    cap: 8
  oath:
    enabled: true
  crown-squads:
    enabled: false
    cost: 50.0
    cap: 4
  conscription:
    enabled: true
    cap: 16
  siege-release:
    enabled: true
    duration-mc-days: 1
    hardened-threshold-mc-days: 1
  siege:
    enabled: true
    flip-threshold-ticks: 3
  aims:
    territory-threshold-ratio: 0.5
  annexation:
    enabled: false
  tribute:
    default-amount: 100.0
  squads:
    enabled: false
    max-members-per-squad: 6
    max-squads-per-officer: 1
    max-squads-per-kingdom: 8

parliament:
  state-opening:
    # Ticks the Speaker leaves between naming one returned member and the next.
    line-delay-ticks: 30

  villager-speaker:
    # In-game days a villager Speaker holds a division open for seated player MPs.
    division-window-days: 1
    # In-game days between the Speaker calling Questions to the Premier through an open session.
    premier-questions-interval-days: 7

  motion:
    # In-game days after a failed motion of no confidence before the House may table another.
    confidence-cooldown-days: 7

  referendum:
    # In-game days a referendum's polling window stays open unless the Premier closes it early.
    polling-window-days: 2

  # A Premier who takes the realm to war, or sends it to the country, in winter loses political
  # standing for it and has the grievance entered in Hansard. No motion of no confidence is ever
  # tabled by the calendar: two seated Members must choose that between them.
  winter-censure:
    enabled: true
    # Steps down the political loyalty ladder the Premier falls. 1 is Faithful to Doubtful.
    tier-steps: 1

election:
  # Polling day: the realm date the writ is issued each realm year. Month 1 is Frostwane, 7 is Harvest.
  # Falls back to general-interval-mc-days only where the realm calendar is unavailable.
  polling-day:
    month: 7
    day: 1
  general-interval-mc-days: 120
  duration-mc-days: 3
  inaugural-fiscal-delay-mc-days: 2
  max-player-seats: 4
  total-seats: 8
  ms-per-mc-day: 1200000
  profession-vote-bias:
    FISCAL:
      farmer: nay
      librarian: aye
      armorer: nay
      weaponsmith: nay
      toolsmith: aye
    BUDGET:
      farmer: aye
      librarian: aye
      armorer: nay
      cleric: aye
    SPEND_MINT:
      farmer: aye
      librarian: aye
      armorer: nay
      cartographer: aye
    SPEND_STIPEND:
      farmer: aye
      librarian: nay
      armorer: nay
      shepherd: aye
    SPEND_PUBLIC_WORK:
      farmer: aye
      librarian: aye
      armorer: nay
      mason: aye

# What each season asks of the realm and grants it. The seasons themselves are fixed:
# spring is Frostwane, Thawtide and Seedfall; summer Blossoming, Highmead and Sunwake;
# autumn Harvest, Goldfall and Emberwane; winter Hallowtide, Longnight and Yulewatch.
season:
  spring:
    crop-growth-factor: 1.0
    outdoor-yield-factor: 1.0
    indoor-yield-factor: 1.0
    standing-levy-upkeep-factor: 1.0
    mustered-levy-upkeep-factor: 1.5
    hostile-spawn-factor: 1.0
    hearths-required: false
    morale-recovery-factor: 1.0
    # Realm days in the field per step of morale lost, whatever else befalls the men. 0 never bites.
    siege-morale-decay-days: 0
  summer:
    crop-growth-factor: 1.25
    outdoor-yield-factor: 1.25
    indoor-yield-factor: 1.0
    standing-levy-upkeep-factor: 0.75
    mustered-levy-upkeep-factor: 1.25
    hostile-spawn-factor: 0.9
    hearths-required: false
    morale-recovery-factor: 1.25
    siege-morale-decay-days: 0
  autumn:
    crop-growth-factor: 1.15
    outdoor-yield-factor: 1.25
    indoor-yield-factor: 1.0
    standing-levy-upkeep-factor: 1.0
    mustered-levy-upkeep-factor: 1.5
    hostile-spawn-factor: 1.0
    hearths-required: false
    morale-recovery-factor: 1.0
    siege-morale-decay-days: 0
  winter:
    crop-growth-factor: 0.5
    outdoor-yield-factor: 0.5
    indoor-yield-factor: 1.0
    standing-levy-upkeep-factor: 1.5
    mustered-levy-upkeep-factor: 2.0
    hostile-spawn-factor: 1.35
    hearths-required: true
    morale-recovery-factor: 0.5
    siege-morale-decay-days: 3

# Hearths: any lit campfire inside linked territory with a container set against it, face to face.
# Nothing is placed or recorded — the daily sweep asks the world afresh. Only the seasons whose
# profile sets hearths-required ask for one; outside those, no fuel burns and nobody goes cold.
hearth:
  # Fuel items burnt out of the container each realm day. A container short of the ration burns nothing.
  fuel-per-day: 2
  # How far a burning hearth's warmth reaches, in blocks.
  warmth-radius: 12.0
  # What counts as fuel. Any Bukkit material name will serve.
  fuel-items:
    - COAL
    - CHARCOAL
    - COAL_BLOCK
    - OAK_LOG
    - SPRUCE_LOG
    - BIRCH_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - MANGROVE_LOG
    - CHERRY_LOG
    - PALE_OAK_LOG
    - CRIMSON_STEM
    - WARPED_STEM
  # What a cold villager yields of its day's gross while the cold stands.
  cold-yield-factor: 0.5
  # Cold days before the villager downs tools, on the same strike as any unpaid one. 0 never strikes.
  cold-strike-days: 3

# The granary: the region a kingdom keeps its grain in, linked with /kingdom granary setregion.
# Its stock is nothing but the hay standing in it and its capacity nothing but the air the builders
# left, so neither is set here. The daily villager sweep counts the realm's farmers, credits their
# wheat at the season's outdoor yield, takes up any loose wheat left on the granary floor, and lays
# a bale of hay in the lowest free course for every bale's worth. Winter's fields give nothing.
granary:
  # Wheat one farmer-profession villager in territory brings in over a realm day, before the
  # season's outdoor-yield factor is reckoned in.
  wheat-per-farmer-day: 3.0
  # Wheat to a bale of hay. The remainder under a bale waits in data.yml for the next day.
  wheat-per-bale: 9
  # Villagers one bale of hay feeds through one winter day. The day's ration is the territory's
  # head-count divided by this and rounded up, drawn off the top of the granary on each of the
  # ninety winter days. Players are never fed from the granary.
  heads-per-hay: 4
  # What a hungry villager yields, as a share of a fed one's. Cold and hunger keep separate ledgers
  # and both bite: a villager frozen and starving at once yields this times the cold's own factor.
  hunger-yield-factor: 0.5
  # Hungry days before the yield is cut, before the villager downs tools (told on its nametag as
  # [starving]), and before it stands in the lot that takes one villager a day. Nought turns a step
  # off altogether. Seated villager MPs, the Premier villager, the villager Speaker, Lords of the
  # Treasury and the Town Crier go hungry but never strike and never starve.
  hunger-yield-days: 1
  hunger-strike-days: 3
  hunger-starve-days: 7
  # Steps every subject's political loyalty falls while the realm's villagers starve, entered in
  # Hansard as a grievance and cried to the realm once for the famine. Nought leaves loyalty alone.
  # No motion is ever tabled for it: the House must choose that for itself.
  famine-tier-steps: 1

# The church: the point a kingdom holds its rites at, sited with /kingdom church set inside your
# own territory and brought into use by consecration. A kingdom that has sited no church has no
# religion at all — no rites, and no coronation gate over its monarch. The priest is sworn by the
# King or Queen; while the seat stands empty, or its holder is in a cell, a cleric villager
# presides at the altar.
church:
  # How long a blessing's regeneration and resistance last, and how many realm days a subject must
  # wait between blessings. A blessing is always free.
  blessing-seconds: 120
  blessing-cooldown-days: 1
  # Realm days the dead wait on their rites. A member's held experience and a dead productive
  # villager's frozen wallet both lapse after this: the experience is lost, and the wallet escheats
  # to the treasury whole.
  funeral-window-days: 3
  # The share of a member's held experience a funeral returns to them.
  funeral-experience-share: 0.5
  # The share of a dead villager's wallet the priest keeps as his living. Where the cleric presides
  # instead, this goes to the treasury with the rest.
  tithe-share: 0.1
